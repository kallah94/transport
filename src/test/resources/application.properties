# Configuration specifique aux tests.
# Version du MongoDB embarque (flapdoodle) utilisee par le test de chargement de contexte.
# Sans cette propriete, EmbeddedMongoAutoConfiguration echoue au demarrage.
de.flapdoodle.mongodb.embedded.version=6.0.8

# Mode dedie en test (comportement identique a la prod actuelle ; pas d'isolation multi-tenant).
app.mode=dedicated
app.tenant.default-key=default
