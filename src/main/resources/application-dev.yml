# Development environment specific properties
# This file should be in .gitignore to avoid committing secrets

spring:
  application:
    name: gayale-transport
  data:
    mongodb:
      uri: ${MONGODB_URI}
      auto-index-creation: true
app:
  qrcode:
    base-url: http://localhost:4200/tickets/
  security:
    jwt:
      expiration: 86400000
      refresh-expiration: 604800000 # 7 days in milliseconds
      secret: ${JWT_SECRET}

