# Common properties shared across all environments
# DO NOT put secrets here - this file is typically committed to version control

spring:
  application:
    name: gayale-transport
  data:
    mongodb:
      # URI surchargeable par la variable d'environnement MONGO_URI (aucun identifiant commité).
      # Repli = MongoDB local de dev uniquement (pas de secret).
      uri: ${MONGO_URI:mongodb://localhost:27017/gayal_transport_dev_local?retryWrites=true&w=majority}
      auto-index-creation: true

server:
  port: 8080

logging:
  level:
    root: WARN
    com.gayale.transport: DEBUG
    org.springframework.data.mongodb: WARN
    org.springframework.security: WARN

app:
  # Mode multi-tenant : "dedicated" (1 client, tenant constant) ou "shared" (N clients par sous-domaine)
  mode: ${APP_MODE:dedicated}
  tenant:
    default-key: ${TENANT_KEY:default}
  qrcode:
    base-url: ${QRCODE_BASE_URL:http://localhost:4200/tickets/}
  license:
    # Cle PUBLIQUE Ed25519 de l'editeur (X.509, base64). La cle PRIVEE correspondante ne doit
    # JAMAIS figurer ici ni dans le depot : elle reste sur le poste de l'editeur.
    # La valeur de repli ci-dessous est une cle de DEVELOPPEMENT, publique et non sensible :
    # en production, definissez LICENSE_PUBLIC_KEY (cf. .docs/licence-doc.rmd).
    public-key: ${LICENSE_PUBLIC_KEY:MCowBQYDK2VwAyEAnGevFEB34QfeSlesdtk9bFlGIvng7iPbHWfgohX4Lug=}
    # Mettre a false UNIQUEMENT en developpement : coupe tout controle de licence.
    enforce: ${LICENSE_ENFORCE:true}
    # Jours d'utilisation toleres apres expiration.
    grace-days: ${LICENSE_GRACE_DAYS:14}
    # Essai automatique a la premiere installation (0 = desactive).
    trial-days: ${LICENSE_TRIAL_DAYS:30}
    # Liaison a l'empreinte machine. false sur une instance web partagee ou en conteneur.
    bind-machine: ${LICENSE_BIND_MACHINE:true}
    # Duree du cache de resolution (secondes).
    cache-seconds: ${LICENSE_CACHE_SECONDS:60}
    # Identifiants de licence revoques, separes par des virgules.
    revoked: ${LICENSE_REVOKED:}
  security:
    jwt:
      expiration: 86400000
      refresh-expiration: 604800000 # 7 days in milliseconds
      # Le secret DOIT être fourni via la variable d'environnement JWT_SECRET en prod.
      # La valeur de repli ci-dessous est un placeholder de DEV, public et non sensible :
      # ne l'utilisez JAMAIS en production (définissez JWT_SECRET).
      secret: ${JWT_SECRET:dev-only-insecure-placeholder-change-via-JWT_SECRET-env-0123456789abcdef}
    # Cookie httpOnly portant le jeton d'acces.
    # Local/Electron : secure=false, same-site=Lax. Prod web (HTTPS, domaines distincts) : secure=true, same-site=None.
    cookie:
      secure: ${COOKIE_SECURE:false}
      same-site: ${COOKIE_SAME_SITE:Lax}
