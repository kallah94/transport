# Common properties shared across all environments
# DO NOT put secrets here - this file is typically committed to version control

spring:
  application:
    name: gayale-transport
  data:
    mongodb:
      uri: ${MONGODB_URI}
      auto-index-creation: true

server:
  port: 8080

logging:
  level:
    root: WARN
    com.gayale.transport: INFO
    org.springframework.data.mongodb: WARN
    org.springframework.security: WARN

app:
  qrcode:
    base-url: http://localhost:4200/tickets/
  security:
    jwt:
      expiration: 86400000
      refresh-expiration: 604800000 # 7 days in milliseconds
      secret: ${JWT_SECRET}